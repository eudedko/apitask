apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: github-api-proxy-production

resources:
  - ../../base
  - namespace.yaml

images:
  - name: github-api-proxy
    newName: github-api-proxy
    newTag: "1.0.0"

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - CACHE_TTL_SECONDS=300
      - MONGO_DATABASE=github_proxy
      - MONGO_REPLICA_MEMBERS=3

patches:
  - path: secrets-patch.yaml
  - path: capacity-patch.yaml
  - target:
      kind: Ingress
      name: github-api-proxy
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api-proxy.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api-proxy.example.com
      - op: replace
        path: /spec/tls/0/secretName
        value: github-api-proxy-tls-production
  - target:
      kind: StatefulSet
      name: mongodb
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 500Mi
      - op: replace
        path: /spec/replicas
        value: 3
