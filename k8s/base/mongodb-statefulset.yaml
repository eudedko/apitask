apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-keyfile-perms
          image: mongodb/mongodb-community-server:8.3-ubi9-slim
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              cp /keyfile-secret/key /keyfile/key
              chown 1000:1000 /keyfile/key
              chmod 0400 /keyfile/key
          volumeMounts:
            - name: mongodb-keyfile-secret
              mountPath: /keyfile-secret
              readOnly: true
            - name: mongodb-keyfile
              mountPath: /keyfile
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              add: [CHOWN, FOWNER]
              drop: [ALL]
      containers:
        - name: mongodb
          image: mongodb/mongodb-community-server:8.3-ubi9-slim
          imagePullPolicy: IfNotPresent
          command:
            - mongod
          args:
            - --replSet
            - $(MONGO_REPLICA_SET)
            - --keyFile
            - /etc/mongodb-keyfile/key
            - --bind_ip_all
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          env:
            - name: MONGO_REPLICA_SET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MONGO_REPLICA_SET
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: mongodb-keyfile
              mountPath: /etc/mongodb-keyfile
              readOnly: true
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "quit(db.adminCommand('ping').ok ? 0 : 2)"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "quit(db.adminCommand('ping').ok ? 0 : 2)"
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: rs-bootstrap
          image: mongodb/mongodb-community-server:8.3-ubi9-slim
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - /scripts/bootstrap.sh
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_HEADLESS_HOST
              value: mongodb-headless
            - name: MONGO_REPLICA_SET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MONGO_REPLICA_SET
            - name: MONGO_REPLICA_MEMBERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MONGO_REPLICA_MEMBERS
            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MONGO_DATABASE
            - name: APP_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USERNAME
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: password
            - name: ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-root-credentials
                  key: username
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-root-credentials
                  key: password
          volumeMounts:
            - name: bootstrap-scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: mongodb-keyfile-secret
          secret:
            secretName: mongodb-keyfile
            defaultMode: 0400
        - name: mongodb-keyfile
          emptyDir: {}
        - name: bootstrap-scripts
          configMap:
            name: mongodb-bootstrap-scripts
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
