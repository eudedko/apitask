apiVersion: batch/v1
kind: CronJob
metadata:
  name: credentials-rotator
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/component: rotator
        spec:
          serviceAccountName: credentials-rotator
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: shared
              emptyDir: {}
          initContainers:
            - name: rotate-mongo-password
              image: mongodb/mongodb-community-server:8.3-ubi9-slim
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  new_pass=$(head -c 24 /dev/urandom | base64 | tr -d '/+=' | cut -c1-32)
                  mongosh --quiet \
                    "mongodb://$MONGO_HOST:$MONGO_PORT/admin?replicaSet=$MONGO_REPLICA_SET" \
                    --username "$ROOT_USERNAME" --password "$ROOT_PASSWORD" \
                    --authenticationDatabase admin \
                    --eval "db.getSiblingDB('admin').changeUserPassword('$APP_DB_USER', '$new_pass')"
                  printf '%s' "$new_pass" > /shared/password
              env:
                - name: MONGO_HOST
                  value: mongodb
                - name: MONGO_PORT
                  value: "27017"
                - name: MONGO_REPLICA_SET
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: MONGO_REPLICA_SET
                - name: APP_DB_USER
                  value: github-proxy
                - name: ROOT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-root-credentials
                      key: username
                - name: ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-root-credentials
                      key: password
              volumeMounts:
                - name: shared
                  mountPath: /shared
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 384Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: false
          containers:
            - name: patch-secret
              image: alpine/k8s:1.34.9
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  new_pass=$(cat /shared/password)
                  kubectl patch secret "$SECRET_NAME" --namespace "$NAMESPACE" \
                    --type merge -p "{\"stringData\":{\"password\":\"$new_pass\"}}"
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SECRET_NAME
                  value: database-credentials
              volumeMounts:
                - name: shared
                  mountPath: /shared
                  readOnly: true
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: false
