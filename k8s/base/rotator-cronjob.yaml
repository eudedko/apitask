apiVersion: batch/v1
kind: CronJob
metadata:
  name: credentials-rotator
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/component: rotator
        spec:
          serviceAccountName: credentials-rotator
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotator
              image: alpine/k8s:1.34.9
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  new_pass=$(head -c 24 /dev/urandom | base64 | tr -d '/+=' | cut -c1-32)
                  kubectl patch secret "$SECRET_NAME" --namespace "$NAMESPACE" \
                    --type merge -p "{\"stringData\":{\"password\":\"$new_pass\"}}"
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SECRET_NAME
                  value: database-credentials
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: false
