apiVersion: batch/v1
kind: CronJob
metadata:
  name: credentials-rotator
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/component: rotator
        spec:
          serviceAccountName: credentials-rotator
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotator
              image: mongodb/mongodb-community-server:8.0-ubi9
              imagePullPolicy: IfNotPresent
              command: [bash, /scripts/rotate.sh]
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SECRET_NAME
                  value: database-credentials
                - name: DEPLOYMENT_NAME
                  value: github-api-proxy
                - name: MONGO_HOST
                  value: mongodb
                - name: MONGO_USER
                  valueFrom:
                    secretKeyRef:
                      name: rotator-mongodb-credentials
                      key: username
                - name: MONGO_PASS
                  valueFrom:
                    secretKeyRef:
                      name: rotator-mongodb-credentials
                      key: password
                - name: DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: password
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 20m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: false
          volumes:
            - name: script
              configMap:
                name: rotator-script
                defaultMode: 0555
