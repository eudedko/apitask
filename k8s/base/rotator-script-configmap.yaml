apiVersion: v1
kind: ConfigMap
metadata:
  name: rotator-script
data:
  rotate.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    umask 077

    # Parse current version. On fresh deploy DB_USERNAME=github-proxy-v0
    # (placeholder); no v0 user exists in Mongo. The parser treats it as
    # "before v1" so the first cycle computes next=1.
    curr=${DB_USERNAME#github-proxy-v}
    if ! [[ "$curr" =~ ^[0-9]+$ ]]; then
      echo "unexpected DB_USERNAME=$DB_USERNAME; refusing to rotate" >&2
      exit 1
    fi
    next=$((curr + 1))
    prev=$((curr - 1))
    new_user="github-proxy-v${next}"
    old_user="github-proxy-v${prev}"
    new_pass=$(openssl rand -base64 32 | tr -d '/+=' | cut -c1-32)

    # 1) create-or-refresh the new user (JS via stdin so secrets don't hit argv)
    mongosh --quiet --host "$MONGO_HOST" --port 27017 \
      --username "$MONGO_USER" --password "$MONGO_PASS" \
      --authenticationDatabase admin --file /dev/stdin <<EOF
      const admin = db.getSiblingDB('admin');
      const u = '$new_user';
      const p = '$new_pass';
      if (admin.getUser(u)) {
        admin.updateUser(u, { pwd: p });
      } else {
        admin.createUser({
          user: u,
          pwd: p,
          roles: [{ role: 'readWrite', db: 'github_proxy' }]
        });
      }
    EOF

    # 2) & 3) k8s API calls (bodies via stdin, retried on transient failure)
    api=https://kubernetes.default.svc
    tok=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kpatch() {
      curl -sSf --retry 5 --retry-delay 2 --cacert "$ca" \
        -H "Authorization: Bearer $tok" \
        -H "Content-Type: application/strategic-merge-patch+json" \
        -X PATCH --data-binary @- "$@" >/dev/null
    }
    kget() {
      curl -sSf --retry 3 --retry-delay 1 --cacert "$ca" \
        -H "Authorization: Bearer $tok" "$@"
    }

    u_b64=$(printf '%s' "$new_user" | base64 -w0)
    p_b64=$(printf '%s' "$new_pass" | base64 -w0)
    printf '{"data":{"username":"%s","password":"%s"}}' "$u_b64" "$p_b64" \
      | kpatch "$api/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME"

    now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    printf '{"spec":{"template":{"metadata":{"annotations":{"kubectl.kubernetes.io/restartedAt":"%s"}}}}}' \
      "$now" \
      | kpatch "$api/apis/apps/v1/namespaces/$NAMESPACE/deployments/$DEPLOYMENT_NAME"

    # 3b) Wait for the rollout to converge before dropping the previous user.
    # If the rollout does not complete within the deadline, exit without
    # dropping — the old user lingers one extra cycle, but no in-flight pod
    # loses the credentials it is authenticated with.
    dep_url="$api/apis/apps/v1/namespaces/$NAMESPACE/deployments/$DEPLOYMENT_NAME"
    deadline=$(( $(date +%s) + 180 ))
    while :; do
      if kget "$dep_url" | python3 -c '
    import json, sys
    try:
        d = json.load(sys.stdin)
    except Exception:
        sys.exit(2)
    m = d.get("metadata") or {}
    sp = d.get("spec") or {}
    st = d.get("status") or {}
    gen = m.get("generation") or 0
    reps = sp.get("replicas") or 0
    ok = ((st.get("observedGeneration") or 0) >= gen
          and (st.get("updatedReplicas") or 0) == reps
          and (st.get("availableReplicas") or 0) == reps
          and (st.get("unavailableReplicas") or 0) == 0)
    sys.exit(0 if ok else 1)
    '; then
        break
      fi
      if [ "$(date +%s)" -ge "$deadline" ]; then
        echo "rollout of $DEPLOYMENT_NAME did not converge within 180s; skipping drop of $old_user" >&2
        exit 1
      fi
      sleep 3
    done

    # 4) drop the prev-prev user if it exists; no live pod holds it any more
    if [ "$prev" -ge 1 ]; then
      mongosh --quiet --host "$MONGO_HOST" --port 27017 \
        --username "$MONGO_USER" --password "$MONGO_PASS" \
        --authenticationDatabase admin --file /dev/stdin <<EOF
        const admin = db.getSiblingDB('admin');
        if (admin.getUser('$old_user')) {
          admin.dropUser('$old_user');
        }
    EOF
    fi

    echo "rotated: $DB_USERNAME -> $new_user; dropped: $old_user (if existed)"
