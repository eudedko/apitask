apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-api-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api-proxy.example.com
      secretName: github-api-proxy-tls
  rules:
    - host: api-proxy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: github-api-proxy
                port:
                  name: http
