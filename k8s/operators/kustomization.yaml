apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Installs stakater/Reloader cluster-wide, with no Helm chart. Apply once per
# cluster, before any overlay under k8s/overlays — Reloader watches Secrets
# referenced by the `secret.reloader.stakater.com/reload` annotation on the
# proxy Deployment and triggers a rolling restart when they change.
#
#   kubectl apply -k k8s/operators
#   kubectl apply -k k8s/overlays/dev

resources:
  - https://raw.githubusercontent.com/stakater/Reloader/v1.4.21/deployments/kubernetes/reloader.yaml
