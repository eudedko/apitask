services:
  mongodb:
    image: mongodb/mongodb-community-server:8.3-ubi9-slim
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  github-proxy:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_HOST: "${MONGO_HOST:-mongodb}"
      MONGO_PORT: "${MONGO_PORT:-27017}"
      MONGO_DATABASE: "${MONGO_DATABASE:-github_proxy}"
      DB_USERNAME: "${DB_USERNAME:-}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-300}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    ports:
      - "127.0.0.1:${PROXY_PORT:-3000}:3000"

volumes:
  mongodb-data:
